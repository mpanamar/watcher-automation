<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sr" id="live" aria-live="polite"></div>
    <header class="nav">
      <p class="wordmark">Watcher</p>
      <div class="nav-end">
        <span id="case-pos">1 of 5</span>
        <button type="button" id="theme" aria-pressed="false">Dark</button>
      </div>
    </header>

    <main class="page">
      <section class="salon">
        <div class="copy">
          <h1 id="console-title">
            Name the
            <span id="dial-crop" class="inline-still" aria-hidden="true"></span>
            watch
          </h1>
          <p class="lead" id="question"></p>
          <dl class="facts">
            <div><dt>Source</dt><dd id="source"></dd></div>
            <div><dt>Subject</dt><dd id="subject"></dd></div>
            <div><dt>Frame</dt><dd id="frame"></dd></div>
          </dl>
          <div class="options" id="options" role="group" aria-label="Choices"></div>
          <form id="ident-form">
            <label for="command">Watch name</label>
            <input id="command" name="command" autocomplete="off" spellcheck="false" aria-describedby="hint" />
            <p class="hint" id="hint" role="status"></p>
            <button class="fire" id="commit" type="submit">Confirm</button>
          </form>
          <p class="lamp"><span>Status</span> <output id="lock">Open</output></p>
        </div>
        <figure class="frame">
          <img id="still" alt="" width="1600" height="1066" />
        </figure>
      </section>

      <section class="dossier" id="dossier" hidden>
        <h2 id="watch-title"></h2>
        <p class="ref">Reference <data id="watch-ref"></data></p>
        <p class="history" id="history"></p>
        <footer class="buys">
          <a id="buy-new" href="#" target="_blank" rel="noreferrer">Official catalogue</a>
          <a id="buy-used" href="#" target="_blank" rel="noreferrer">Chrono24 market</a>
        </footer>
      </section>

      <nav class="queue" aria-label="Case queue">
        <button type="button" id="prev">Previous</button>
        <p>Identified <data id="score">0 / 5</data></p>
        <button type="button" id="next">Next</button>
      </nav>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
